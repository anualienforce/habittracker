name: Build iOS Simulator App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App for Simulator
    runs-on: macos-14

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Cache Flutter SDK
      - name: Cache Flutter SDK
        uses: actions/cache@v3
        with:
          path: ${{ runner.tool_cache }}/flutter
          key: flutter-3.35.1
          restore-keys: flutter-

      # 3️⃣ Check Xcode version
      - name: Check Xcode version
        run: xcodebuild -version

      # 4️⃣ Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          cache: true   # caches pub packages automatically

      # 5️⃣ Clean Flutter & Pods to avoid Swift plugin issues
      - name: Clean Flutter & Pods
        run: |
          flutter clean
          rm -rf ios/Pods
          rm ios/Podfile.lock
          flutter pub get
          cd ios
          pod repo update
          pod install --verbose
          cd ..

      # 6️⃣ Build iOS Simulator app
      - name: Build iOS Simulator app
        run: flutter build ios --simulator --no-codesign

      # 7️⃣ List build output
      - name: List build artifacts
        run: ls -R build/ios/iphonesimulator

      # 8️⃣ Upload .app artifact
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/iphonesimulator/*.app
