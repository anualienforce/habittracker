name: Build iOS Simulator App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App for Simulator
    runs-on: macos-14

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Flutter (with caching)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          cache: true

      # 3️⃣ Check Flutter version
      - name: Check Flutter version
        run: flutter --version

      # 4️⃣ Check Xcode version
      - name: Check Xcode version
        run: xcodebuild -version

      # 5️⃣ Cache CocoaPods
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      # 6️⃣ Install Flutter dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 7️⃣ Clean and re-install Pods
      - name: Clean and re-install Pods
        run: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod repo update
          pod install
          cd ..

      # 8️⃣ Force remove all bridging headers
      - name: Remove all Bridging Headers
        run: |
          echo "=== Removing all Bridging Headers ==="
          find ios -name "*Bridging-Header.h" -exec rm -f {} \;
          echo "✅ All Bridging Headers removed"

      # 9️⃣ Force remove SWIFT_OBJC_BRIDGING_HEADER from Xcode project
      - name: Remove all SWIFT_OBJC_BRIDGING_HEADER references
        run: |
          echo "=== Removing all SWIFT_OBJC_BRIDGING_HEADER references from project.pbxproj ==="
          sed -i '' '/SWIFT_OBJC_BRIDGING_HEADER/d' ios/Runner.xcodeproj/project.pbxproj
          echo "✅ All SWIFT_OBJC_BRIDGING_HEADER references removed"
      

      # 🔟 Build iOS app for Simulator
      - name: Build iOS Simulator app
        run: flutter build ios --simulator --no-codesign

      # 1️⃣1️⃣ List build output
      - name: List build artifacts
        run: ls -R build/ios/iphonesimulator

      # 1️⃣2️⃣ Upload .app as artifact
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/iphonesimulator/*.app
