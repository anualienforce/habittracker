name: Build iOS Simulator App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App for Simulator
    runs-on: macos-14

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Flutter with caching
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          cache: true

      # 3️⃣ Check Flutter & Xcode version
      - name: Check Flutter version
        run: flutter --version

      - name: Check Xcode version
        run: xcodebuild -version

      # 4️⃣ Cache CocoaPods
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      # 5️⃣ Install Flutter dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 6️⃣ Clean Pods and remove old bridging headers
      - name: Clean Pods & Remove Bridging Headers
        run: |
          echo "=== Cleaning Pods ==="
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod repo update
          echo "=== Removing all Bridging Headers ==="
          find . -name "*Bridging-Header.h" -exec rm {} \;
          echo "✅ All bridging headers removed"
          echo "=== Removing SWIFT_OBJC_BRIDGING_HEADER settings ==="
          plutil -replace TARGETS.Runner.buildSettings.SWIFT_OBJC_BRIDGING_HEADER -string "" Runner.xcodeproj/project.pbxproj || true
          cd ..

      # 7️⃣ Ensure GeneratedPluginRegistrant exists
      - name: Ensure GeneratedPluginRegistrant.swift
        run: |
          echo "=== Regenerating GeneratedPluginRegistrant.swift ==="
          flutter pub get
          flutter clean
          flutter build ios --simulator --no-codesign || true
          if [ ! -f "ios/Flutter/GeneratedPluginRegistrant.swift" ]; then
            echo "❌ GeneratedPluginRegistrant.swift still missing!"
            exit 1
          else
            echo "✅ GeneratedPluginRegistrant.swift exists"
          fi

      # 8️⃣ Build iOS Simulator app
      - name: Build iOS Simulator app
        run: flutter build ios --simulator --no-codesign

      # 9️⃣ List build output
      - name: List build artifacts
        run: ls -R build/ios/iphonesimulator

      # 🔟 Upload .app as artifact
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/iphonesimulator/*.app
