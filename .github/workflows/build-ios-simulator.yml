name: Build iOS Simulator App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App for Simulator
    runs-on: macos-14  # Xcode 15 preinstalled

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35' # matches iOS 15 compatible Flutter

      - name: Upgrade dependencies
        run: flutter pub get

      - name: Update Podfile for iOS 15 and disable library distribution
        run: |
          cd ios
          sed -i '' "s/platform :ios, .*/platform :ios, '15.0'/" Podfile
          echo "\npost_install do |installer|\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings['BUILD_LIBRARY_FOR_DISTRIBUTION'] = 'NO'\n    end\n  end\nend" >> Podfile
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Build iOS app for simulator
        run: flutter build ios --simulator --no-codesign

      - name: List build output
        run: ls -R build/ios/iphonesimulator

      - name: Upload .app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/iphonesimulator/*.app
