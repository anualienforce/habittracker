name: Build iOS Simulator App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App for Simulator
    runs-on: macos-14  # macOS with Xcode 15

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Flutter (use Flutter 3.35.6 for Dart 3.7+)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'

      # Step 3: Clean Flutter project to remove old build artifacts
      - name: Clean Flutter project
        run: flutter clean

      # Step 4: Get dependencies
      - name: Install dependencies
        run: flutter pub get

      # Step 5: Set iOS deployment target to 17 for StoreKit2 compatibility
      - name: Update iOS deployment target
        run: |
          sed -i '' 's/platform :ios, .*/platform :ios, "17.0"/' ios/Podfile

      # Step 6: Install CocoaPods
      - name: Install iOS pods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # Step 7: Build iOS simulator app
      - name: Build iOS app for simulator
        run: flutter build ios --simulator --no-codesign

      # Step 8: List build output (for debugging)
      - name: List build output
        run: ls -R build/ios/iphonesimulator

      # Step 9: Upload .app as artifact
      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/iphonesimulator/*.app
